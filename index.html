<script>
const paper=document.getElementById('paper');
const workspace=document.getElementById('workspace');
let savedRange=null;
let pageName='A4';
let orientation='portrait';

const sizes={
  A4:['210mm','297mm'],
  A5:['148mm','210mm'],
  Letter:['216mm','279mm'],
  Legal:['216mm','356mm']
};

function remember(){
  const s=getSelection();
  if(s.rangeCount && paper.contains(s.anchorNode)){
    savedRange=s.getRangeAt(0).cloneRange();
  }
}
['mouseup','keyup','touchend','blur'].forEach(e=>{
  paper.addEventListener(e,()=>setTimeout(remember,20));
});

function restore(){
  if(!savedRange)return;
  const s=getSelection();
  s.removeAllRanges();
  try{s.addRange(savedRange)}catch(e){}
}

function cmd(command){
  restore();
  paper.focus();
  document.execCommand(command,false,null);
  remember();
}

function setFont(name){
  restore();
  paper.focus();
  document.execCommand('fontName',false,name);
  remember();
}

function setFontSize(px){
  restore();
  paper.focus();
  document.execCommand('fontSize',false,'7');
  paper.querySelectorAll('font[size="7"]').forEach(el=>{
    el.removeAttribute('size');
    el.style.fontSize=px+'px';
  });
  remember();
}

function changeSize(delta){
  const box=document.getElementById('fontSize');
  let n=parseInt(box.value,10)+delta;
  n=Math.max(8,Math.min(72,n));
  box.value=n;
  setFontSize(n);
}

function setLine(v){
  document.documentElement.style.setProperty('--lh',v);
  toast('Line spacing '+v);
  closeMenus();
}

function setPage(name){
  pageName=name;
  applyPage();
  closeMenus();
  toast(name+' Page Size স্থির করা হয়েছে');
}

function setOrientation(value){
  orientation=value;
  applyPage();
  closeMenus();
  toast(value==='portrait'?'Portrait স্থির':'Landscape স্থির');
}

function applyPage(){
  let [w,h]=sizes[pageName];
  if(orientation==='landscape')[w,h]=[h,w];
  document.documentElement.style.setProperty('--pw',w);
  document.documentElement.style.setProperty('--ph',h);
}

function setMargin(v){
  document.documentElement.style.setProperty('--margin',v);
  closeMenus();
  toast('Margin '+v);
}

/* ---------- ZOOM ---------- */
function setZoom(v){
  v=parseFloat(v);
  if(!isFinite(v))v=1;
  v=Math.max(.4,Math.min(2.5,v));
  document.documentElement.style.setProperty('--zoom',v);
  document.getElementById('zoom').value=String(v);
}

function changeZoom(delta){
  const current=parseFloat(document.getElementById('zoom').value);
  let next=Math.round((current+delta)*100)/100;
  next=Math.max(.4,Math.min(2.5,next));
  setZoom(next);
}

/* Fit page to the available mobile workspace width.
   This changes ONLY zoom; selected physical page size remains unchanged. */
function fitWidth(){
  const width=workspace.clientWidth-20;
  const paperPx=paper.offsetWidth;
  if(!paperPx)return;
  const z=Math.max(.4,Math.min(2.5,width/paperPx));
  setZoom(Math.round(z*100)/100);
}

/* ---------- MENUS ---------- */
function openMenu(id,button){
  closeMenus();
  const menu=document.getElementById(id);
  menu.classList.add('show');
  const r=button.getBoundingClientRect();
  menu.style.top=(r.bottom+3)+'px';
  menu.style.left=Math.max(4,Math.min(r.left,innerWidth-250))+'px';
}
function closeMenus(){
  document.querySelectorAll('.dropdown').forEach(x=>x.classList.remove('show'));
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.menu'))closeMenus();
});

/* ---------- TABLE ---------- */
function currentTable(){
  restore();
  let n=getSelection().anchorNode;
  if(n && n.nodeType===3)n=n.parentElement;
  return n && n.closest ? n.closest('table'):null;
}

function addResizeHandles(table){
  table.querySelectorAll('td,th').forEach(cell=>{
    if(cell.querySelector('.col-handle'))return;
    const h=document.createElement('span');
    h.className='col-handle';
    cell.appendChild(h);
    h.addEventListener('pointerdown',startColResize);
  });
}

function startColResize(e){
  e.preventDefault();
  e.stopPropagation();

  const cell=e.currentTarget.parentElement;
  const table=cell.closest('table');
  const col=cell.cellIndex;
  const startX=e.clientX;
  const startW=cell.getBoundingClientRect().width;

  function move(ev){
    const w=Math.max(35,startW+(ev.clientX-startX));
    [...table.rows].forEach(row=>{
      if(row.cells[col])row.cells[col].style.width=w+'px';
    });
  }
  function up(){
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
  }
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
}

function makeTable(){
  let rows=parseInt(prompt('কতটি Row চান?','5'),10);
  if(!rows)return;
  let cols=parseInt(prompt('কতটি Column চান?','4'),10);
  if(!cols)return;

  rows=Math.min(50,Math.max(1,rows));
  cols=Math.min(20,Math.max(1,cols));

  restore();
  paper.focus();

  let html='<table><tbody>';
  for(let r=0;r<rows;r++){
    html+='<tr>';
    for(let c=0;c<cols;c++){
      html+=(r===0?'<th>শিরোনাম</th>':'<td><br></td>');
    }
    html+='</tr>';
  }
  html+='</tbody></table><p><br></p>';

  document.execCommand('insertHTML',false,html);
  const tables=paper.querySelectorAll('table');
  addResizeHandles(tables[tables.length-1]);
  remember();
  toast(rows+' × '+cols+' টেবিল তৈরি হয়েছে');
}

function addRow(){
  const t=currentTable();
  if(!t){alert('টেবিলের একটি ঘরে কার্সর রাখুন।');return}
  const row=t.insertRow(-1);
  const count=t.rows[0].cells.length;
  for(let i=0;i<count;i++)row.insertCell(-1).innerHTML='<br>';
  addResizeHandles(t);
}

function addCol(){
  const t=currentTable();
  if(!t){alert('টেবিলের একটি ঘরে কার্সর রাখুন।');return}
  [...t.rows].forEach((r,i)=>{
    const c=r.insertCell(-1);
    c.innerHTML=i===0?'শিরোনাম':'<br>';
  });
  addResizeHandles(t);
}

function deleteRow(){
  const t=currentTable();
  if(!t){alert('টেবিলের একটি ঘরে কার্সর রাখুন।');return}
  if(t.rows.length>1)t.deleteRow(-1);
}

function deleteCol(){
  const t=currentTable();
  if(!t){alert('টেবিলের একটি ঘরে কার্সর রাখুন।');return}
  if(t.rows[0].cells.length>1){
    [...t.rows].forEach(r=>r.deleteCell(-1));
  }
}

function pageBreak(){
  restore();
  paper.focus();
  document.execCommand(
    'insertHTML',false,
    '<div style="page-break-before:always"></div><p><br></p>'
  );
}

function insertDate(){
  restore();
  paper.focus();
  const d=new Date();
  const text=String(d.getDate()).padStart(2,'0')+'/'+
             String(d.getMonth()+1).padStart(2,'0')+'/'+
             d.getFullYear();
  document.execCommand('insertText',false,text);
}

/* ---------- FILE ---------- */
function newDoc(){
  closeMenus();
  if(!confirm('নতুন খালি রিপোর্ট শুরু করবেন?'))return;
  paper.innerHTML='<p><br></p>';
  document.getElementById('docTitle').value='নামহীন অফিস রিপোর্ট';
}

function saveDoc(){
  localStorage.setItem('office_report_html',paper.innerHTML);
  localStorage.setItem('office_report_title',document.getElementById('docTitle').value);
  localStorage.setItem('office_report_page',JSON.stringify({
    pageName,orientation,
    margin:getComputedStyle(document.documentElement).getPropertyValue('--margin'),
    lh:getComputedStyle(document.documentElement).getPropertyValue('--lh')
  }));
  closeMenus();
  toast('রিপোর্ট সংরক্ষণ হয়েছে');
}

function loadDoc(){
  const html=localStorage.getItem('office_report_html');
  if(!html){alert('কোনো সংরক্ষিত রিপোর্ট নেই।');return}
  paper.innerHTML=html;
  document.getElementById('docTitle').value=
    localStorage.getItem('office_report_title')||'নামহীন অফিস রিপোর্ট';

  paper.querySelectorAll('table').forEach(addResizeHandles);

  const p=JSON.parse(localStorage.getItem('office_report_page')||'null');
  if(p){
    pageName=p.pageName||'A4';
    orientation=p.orientation||'portrait';
    if(p.margin)document.documentElement.style.setProperty('--margin',p.margin);
    if(p.lh)document.documentElement.style.setProperty('--lh',p.lh);
    applyPage();
  }
  closeMenus();
  toast('রিপোর্ট আনা হয়েছে');
}

function printDoc(){
  closeMenus();
  window.print();
}

function downloadWord(){
  closeMenus();
  const name=(document.getElementById('docTitle').value||'অফিস-রিপোর্ট')
    .replace(/[\\/:*?"<>|]/g,'_');

  const html='<!doctype html><html lang="bn"><head><meta charset="utf-8">'+
    '<style>body{font-family:Arial,sans-serif}table{border-collapse:collapse;width:100%}'+
    'td,th{border:1px solid #000;padding:5px}</style></head><body>'+
    paper.innerHTML+'</body></html>';

  const blob=new Blob(['\ufeff',html],{type:'application/msword'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name+'.doc';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------- STATUS ---------- */
function toast(text){
  const s=document.getElementById('status');
  s.textContent=text;s.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>s.classList.remove('show'),1700);
}

document.getElementById('docTitle').addEventListener('input',e=>{
  document.title=e.target.value||'অফিস রিপোর্ট এডিটর';
});

/* Start with fixed A4 physical page and 100% view. */
setPage('A4');
setOrientation('portrait');
</script>
</body>
</html>'''
